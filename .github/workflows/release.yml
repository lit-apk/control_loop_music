name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.storePassword }}
      KEY_PASSWORD: ${{ secrets.keyPassword }}
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Configure signing
        run: |
          mkdir -p sign
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sign/release.keystore
          cat > keystore.properties <<EOF
          storeFile=sign/release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=data-sync
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew test assembleRelease lint

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk

